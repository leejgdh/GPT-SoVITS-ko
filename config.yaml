# GPT-SoVITS TTS Service 설정
# 기본값은 코드에 내장. 변경이 필요한 항목만 기재.

# 서버 설정
service:
  host: 0.0.0.0
  port: 14983

# TTS 엔진 설정 (선택)
# device / is_half 가 비어있으면 자동 감지됨 (CUDA 가용 + SM>=7.0 GPU → fp16).
# 명시적으로 고정하고 싶을 때만 적습니다:
# tts:
#   custom:
#     device: cuda:0       # 또는 cpu
#     is_half: true        # fp16 (GPU 메모리 절반)
#     version: v2Pro
#     voice_dir: data/voice/dahwi   # step3 결과에서 가중치 자동 탐색

# voice 디렉토리 루트 (하위에서 voice.yaml을 스캔)
voices_dir: data/voice

# 서버 시작 시 기본 로드할 voice (optional)
default_voice: lena

# ---------------------------------------------------------------------------
# Voice Checker
# step1 ASR에서 CNN 품질 분류를 자동 적용합니다.
# 비활성화하려면 voice_checker 섹션 전체를 주석 처리하세요.
# ---------------------------------------------------------------------------
voice_checker:
  inference:
    model_path: "data/voice-checker/models/best_model.pth"
    threshold: 0.5
  training:
    batch_size: 16
    epochs: 50
    learning_rate: 0.001
    early_stop_patience: 10
  audio:
    sample_rate: 44100
    n_mels: 64
    n_fft: 1024
    hop_length: 512
    target_length: 128