<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Demo</title>
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --border: #d0d0d0;
    --text: #333333;
    --text-dim: #777777;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #b91c1c;
    --ok: #16a34a;
    --warn: #d97706;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    font-size: 20px;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .row:last-child { margin-bottom: 0; }

  label {
    font-size: 13px;
    color: var(--text-dim);
    min-width: 72px;
  }

  select, input[type="text"], input[type="number"], textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
  }

  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  select { min-width: 160px; }

  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    line-height: 1.5;
  }

  .slider-row {
    flex: 1;
    min-width: 200px;
  }

  .slider-row input[type="range"] {
    flex: 1;
  }

  .slider-value {
    min-width: 40px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: 13px;
  }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }

  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  button.secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  button.secondary:hover:not(:disabled) {
    background: var(--bg);
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  #status {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 8px;
    min-height: 18px;
  }

  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }
  #status.busy { color: var(--warn); }

  audio {
    width: 100%;
    margin-top: 8px;
  }

  .meta {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  a.download {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
  }

  a.download:hover { text-decoration: underline; }

  .footer {
    margin-top: 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="container">
  <h1>TTS Demo</h1>
  <div class="subtitle">텍스트를 입력하고 voice / emotion 을 선택해 합성한다.</div>

  <div class="card">
    <div class="row">
      <label for="voice">Voice</label>
      <select id="voice"></select>
      <label for="emotion">Emotion</label>
      <select id="emotion"></select>
      <button class="secondary" id="reload" type="button">↻</button>
    </div>

    <div class="row">
      <label for="lang">Lang</label>
      <select id="lang">
        <option value="ko" selected>ko</option>
        <option value="en">en</option>
        <option value="ja">ja</option>
        <option value="zh">zh</option>
        <option value="auto">auto</option>
      </select>
      <label for="media">Format</label>
      <select id="media">
        <option value="wav" selected>wav</option>
        <option value="ogg">ogg</option>
        <option value="aac">aac</option>
      </select>
    </div>

    <div class="row">
      <label for="speed">Speed</label>
      <div class="slider-row" style="display:flex; gap:8px; align-items:center;">
        <input type="range" id="speed" min="0.5" max="2.0" step="0.05" value="1.0">
        <span class="slider-value" id="speed-val">1.00</span>
      </div>
      <label for="volume">Volume</label>
      <div class="slider-row" style="display:flex; gap:8px; align-items:center;">
        <input type="range" id="volume" min="0.0" max="2.0" step="0.05" value="1.0">
        <span class="slider-value" id="volume-val">1.00</span>
      </div>
    </div>

    <div class="row">
      <textarea id="text" placeholder="합성할 텍스트를 입력하세요."></textarea>
    </div>

    <div class="actions">
      <button id="synthesize" type="button">합성</button>
      <button class="secondary" id="stop" type="button" disabled>정지</button>
    </div>

    <div id="status"></div>
  </div>

  <div class="card">
    <audio id="player" controls></audio>
    <div class="meta">
      <span id="meta-info"></span>
      <a id="download" class="download" style="display:none; margin-left:12px;">다운로드</a>
    </div>
  </div>

  <div class="footer">
    <a href="/swagger" target="_blank">Swagger</a>
    · <a href="/review" target="_blank">라벨 검수</a>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const origin = window.location.origin;

let currentBlobUrl = null;

function setStatus(msg, kind) {
  const el = $('status');
  el.textContent = msg || '';
  el.className = kind || '';
}

async function loadVoices() {
  setStatus('voice 목록 로딩...', 'busy');
  try {
    const res = await fetch(`${origin}/voices`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const sel = $('voice');
    sel.innerHTML = '';
    const available = (data.voices || []).filter(v => v.available);
    if (available.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '(사용 가능한 voice 없음)';
      sel.appendChild(opt);
      setStatus('학습 완료된 voice 가 없습니다.', 'error');
      return;
    }
    for (const v of available) {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = `${v.name} (${v.version}, ${v.ref_lang})`;
      sel.appendChild(opt);
    }
    if (data.current_voice && available.some(v => v.name === data.current_voice)) {
      sel.value = data.current_voice;
    }
    await loadEmotions();
    setStatus('', '');
  } catch (e) {
    setStatus(`voice 목록 로드 실패: ${e.message}`, 'error');
  }
}

async function loadEmotions() {
  const voice = $('voice').value;
  const sel = $('emotion');
  sel.innerHTML = '';
  if (!voice) return;
  try {
    const res = await fetch(`${origin}/voices/${encodeURIComponent(voice)}/emotions`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const names = Object.keys(data.emotions || {});
    if (names.length === 0) {
      const opt = document.createElement('option');
      opt.value = 'default';
      opt.textContent = 'default';
      sel.appendChild(opt);
      return;
    }
    for (const n of names) {
      const opt = document.createElement('option');
      opt.value = n;
      opt.textContent = n;
      sel.appendChild(opt);
    }
    if (names.includes('default')) sel.value = 'default';
  } catch (e) {
    setStatus(`emotion 로드 실패: ${e.message}`, 'error');
  }
}

async function synthesize() {
  const voice = $('voice').value;
  const text = $('text').value.trim();
  if (!voice) { setStatus('voice 를 선택하세요.', 'error'); return; }
  if (!text) { setStatus('텍스트를 입력하세요.', 'error'); return; }

  const body = {
    voice,
    text,
    text_lang: $('lang').value,
    emotion: $('emotion').value || 'default',
    speed_factor: parseFloat($('speed').value),
    volume: parseFloat($('volume').value),
    media_type: $('media').value,
  };

  $('synthesize').disabled = true;
  setStatus('합성 중...', 'busy');
  const t0 = performance.now();

  try {
    const res = await fetch(`${origin}/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try {
        const err = await res.json();
        if (err.message) msg += ` — ${err.message}`;
      } catch (_) { /* binary 응답이면 무시 */ }
      throw new Error(msg);
    }

    const blob = await res.blob();
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);

    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(blob);

    const player = $('player');
    player.src = currentBlobUrl;
    player.play().catch(() => { /* autoplay 차단 무시 */ });

    const sizeKb = (blob.size / 1024).toFixed(1);
    $('meta-info').textContent = `${body.media_type} · ${sizeKb} KB · ${elapsed}s`;

    const dl = $('download');
    dl.href = currentBlobUrl;
    dl.download = `tts_${voice}_${Date.now()}.${body.media_type}`;
    dl.style.display = '';

    setStatus(`완료 (${elapsed}s)`, 'ok');
  } catch (e) {
    setStatus(`합성 실패: ${e.message}`, 'error');
  } finally {
    $('synthesize').disabled = false;
  }
}

function bindSlider(rangeId, valId) {
  const r = $(rangeId);
  const v = $(valId);
  const update = () => { v.textContent = parseFloat(r.value).toFixed(2); };
  r.addEventListener('input', update);
  update();
}

document.addEventListener('DOMContentLoaded', () => {
  bindSlider('speed', 'speed-val');
  bindSlider('volume', 'volume-val');

  $('voice').addEventListener('change', loadEmotions);
  $('reload').addEventListener('click', loadVoices);
  $('synthesize').addEventListener('click', synthesize);
  $('stop').addEventListener('click', () => {
    const p = $('player');
    p.pause();
    p.currentTime = 0;
  });

  $('text').addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      synthesize();
    }
  });

  $('player').addEventListener('play', () => { $('stop').disabled = false; });
  $('player').addEventListener('pause', () => { $('stop').disabled = true; });
  $('player').addEventListener('ended', () => { $('stop').disabled = true; });

  loadVoices();
});
</script>
</body>
</html>
